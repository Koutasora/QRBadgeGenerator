<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generator Identyfikatorów 90x55 mm</title>

  <!-- Biblioteka do generowania kodów QR -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    /* =========================================================
       STYLE STRONY / PANELU STEROWANIA
       ========================================================= */
    :root {
      --bg-color: #f3f4f6;
      --panel-bg: #ffffff;
      --accent-color: #2563eb;
      --text-color: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      min-height: 100vh;
    }

    /* Panel boczny z formularzem */
    .sidebar {
      width: 420px;
      background: var(--panel-bg);
      padding: 24px;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      z-index: 10;
      overflow-y: auto;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
    }

    .sidebar h1 {
      font-size: 1.4rem;
      margin-bottom: 16px;
      color: #111827;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Tabela wprowadzania danych */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 12px;
    }

    .data-table th {
      text-align: left;
      font-size: 0.8rem;
      padding: 6px;
      color: #6b7280;
    }

    .data-table td {
      padding: 4px;
    }

    .data-table input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.9rem;
    }

    .btn-remove {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }

    /* Przyciski */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-add {
      background: #e5e7eb;
      color: #374151;
      margin-bottom: 20px;
    }

    .btn-add:hover {
      background: #d1d5db;
    }

    .btn-print {
      background: var(--accent-color);
      color: white;
      font-size: 1rem;
    }

    .btn-print:hover {
      background: #1d4ed8;
    }

    .info-box {
      background: #eff6ff;
      border-left: 4px solid var(--accent-color);
      padding: 12px;
      font-size: 0.82rem;
      color: #1e40af;
      margin-bottom: 20px;
      border-radius: 0 4px 4px 0;
    }

    /* =========================================================
       PODGLĄD ARKUSZA A4
       ========================================================= */
    .preview-container {
      margin-left: 420px;
      flex: 1;
      padding: 40px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* Strona A4 ze standardowymi marginesami MS Word (25.4 mm) */
    .a4-page {
      width: 210mm;
      min-height: 297mm;
      background: white;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      padding: 25.4mm; /* Standardowy margines MS Word */
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 10mm; /* Odstęp pomiędzy identyfikatorami */
      box-sizing: border-box;
    }

    /* =========================================================
       STRUKTURA IDENTYFIKATORA (90x55 mm)
       ========================================================= */
    .badge {
      width: 90mm;
      height: 55mm;
      position: relative;
      background: #ffffff;
      /* Wyrazisty, grubszy obrys zewnętrzny */
      border: 3px solid #000000;
      box-sizing: border-box;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10mm; /* Odstęp 3 cm (30 mm) między kodami QR */
      page-break-inside: avoid;
    }

    /* Tło identyfikatora */
    .badge-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Skalowanie dopasowane do wymiarów ramki */
      z-index: 1;
    }

    /* Ramka dla kodów QR */
    .qr-frame {
      position: relative;
      z-index: 2;
      background: #ffffff;
      /* Gruba, mocna ramka wewnętrzna */
      border: 2px solid #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      box-sizing: border-box;
      padding: 2px;
    }

    /* Wymiary kodów QR */
    .qr-login {
      width: 30mm;
      height: 30mm;
    }

    .qr-password {
      width: 25mm;
      height: 25mm;
    }

    /* Skalowanie zawartości QR kordu */
    .qr-frame img, .qr-frame canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
    }

    /* =========================================================
       REGUŁY DRUKU (@media print)
       ========================================================= */
    @media print {
      body {
        background: white;
      }

      .sidebar {
        display: none !important;
      }

      .preview-container {
        margin-left: 0 !important;
        padding: 0 !important;
      }

      .a4-page {
        box-shadow: none !important;
        padding: 25.4mm !important;
        width: 210mm !important;
        height: 297mm !important;
        margin: 0 !important;
      }

      @page {
        size: A4 portrait;
        margin: 0;
      }
    }
  </style>
</head>
<body>

  <!-- PANEL STEROWANIA -->
  <div class="sidebar">
    <h1>Generator Identyfikatorów</h1>

    <div class="info-box">
      <strong>Wymiary identyfikatora:</strong> 90 × 55 mm (Orientacja pozioma)<br>
      <strong>Sugerowany rozmiar tła:</strong> 1063 × 650 px (300 DPI)<br>
      <strong>Marginesy arkusza A4:</strong> 25.4 mm (MS Word Standard)
    </div>

    <!-- Tło -->
    <div class="form-group">
      <label for="bgInput">Grafika tła identyfikatora:</label>
      <input type="file" id="bgInput" accept="image/*">
    </div>

    <!-- Tabela danych -->
    <div class="form-group">
      <label>Dane do kodów QR:</label>
      <table class="data-table">
        <thead>
          <tr>
            <th>Login (QR 3x3 cm)</th>
            <th>Hasło (QR 2.5x2.5 cm)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="inputRows">
          <!-- Wiersze generowane dynamicznie -->
        </tbody>
      </table>
      <button class="btn btn-add" id="addRowBtn">+ Dodaj kolejną pozycję</button>
    </div>

    <!-- Przycisk drukowania -->
    <button class="btn btn-print" onclick="window.print()">Drukuj / Zapisz jako PDF</button>
  </div>

  <!-- PODGLĄD STRONY A4 -->
  <div class="preview-container">
    <div class="a4-page" id="a4Page">
      <!-- Identyfikatory dodawane dynamicznie -->
    </div>
  </div>

  <script>
    let bgImageData = null;

    // Domyślne dane początkowe
    const initialData = [
      { login: "user01", pass: "Pass123!" },
      { login: "user02", pass: "Secure456" }
    ];

    document.addEventListener("DOMContentLoaded", () => {
      // Inicjalizacja domyślnych wierszy
      initialData.forEach(item => addRow(item.login, item.pass));
      
      // Podpięcie zdarzenia dodawania wiersza
      document.getElementById("addRowBtn").addEventListener("click", () => addRow("", ""));

      // Podpięcie wgrywania tła
      document.getElementById("bgInput").addEventListener("change", handleBgUpload);

      renderBadges();
    });

    // Dodawanie wierszy w tabeli
    function addRow(login = "", pass = "") {
      const tbody = document.getElementById("inputRows");
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td><input type="text" class="input-login" value="${login}" placeholder="Login"></td>
        <td><input type="text" class="input-pass" value="${pass}" placeholder="Hasło"></td>
        <td><button class="btn-remove">&times;</button></td>
      `;

      // Nasłuchiwanie zmian w polach
      tr.querySelectorAll("input").forEach(input => {
        input.addEventListener("input", renderBadges);
      });

      // Usuwanie wiersza
      tr.querySelector(".btn-remove").addEventListener("click", () => {
        tr.remove();
        renderBadges();
      });

      tbody.appendChild(tr);
      renderBadges();
    }

    // Obsługa wgrywania tła
    function handleBgUpload(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          bgImageData = event.target.result;
          renderBadges();
        };
        reader.readAsDataURL(file);
      }
    }

    // Pobieranie wprowadzonych danych z tabeli
    function getFormData() {
      const rows = document.querySelectorAll("#inputRows tr");
      const data = [];
      rows.forEach(row => {
        const login = row.querySelector(".input-login").value;
        const pass = row.querySelector(".input-pass").value;
        if (login || pass) {
          data.push({ login, pass });
        }
      });
      return data;
    }

    // Renderowanie kart na arkuszu A4
    function renderBadges() {
      const page = document.getElementById("a4Page");
      page.innerHTML = "";
      const items = getFormData();

      items.forEach((item, index) => {
        const badge = document.createElement("div");
        badge.className = "badge";

        // Jeśli ustawiono tło, dodaj je
        if (bgImageData) {
          const bgImg = document.createElement("img");
          bgImg.className = "badge-bg";
          bgImg.src = bgImageData;
          badge.appendChild(bgImg);
        }

        // KONTENER 1: QR Kod - Login (3x3 cm)
        const frameLogin = document.createElement("div");
        frameLogin.className = "qr-frame qr-login";
        const qrLoginContainer = document.createElement("div");
        frameLogin.appendChild(qrLoginContainer);
        badge.appendChild(frameLogin);

        // KONTENER 2: QR Kod - Hasło (2.5x2.5 cm)
        const framePass = document.createElement("div");
        framePass.className = "qr-frame qr-password";
        const qrPassContainer = document.createElement("div");
        framePass.appendChild(qrPassContainer);
        badge.appendChild(framePass);

        page.appendChild(badge);

        // Generowanie kodów QR
        if (item.login) {
          new QRCode(qrLoginContainer, {
            text: item.login,
            width: 120,
            height: 120,
            correctLevel: QRCode.CorrectLevel.H
          });
        }

        if (item.pass) {
          new QRCode(qrPassContainer, {
            text: item.pass,
            width: 100,
            height: 100,
            correctLevel: QRCode.CorrectLevel.H
          });
        }
      });
    }
  </script>
</body>
</html>
